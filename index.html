<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Halaman pembayaran KJS-STORE dengan tema hitam emas, melanjutkan transaksi dengan mudah dan aman." />
    <title>Pembayaran - KJS-STORE</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap');

        /* Warna hitam dan emas */
        :root {
            --gold: rgb(212, 175, 55);
            --gold-dark: rgb(180, 140, 40);
            --black: #0a0a0a;
            --black-light: #1a1a1a;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: linear-gradient(135deg, var(--black), #1a1a1a);
            font-family: 'Poppins', sans-serif;
            color: var(--gold);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: var(--black-light);
            border-radius: 24px;
            max-width: 720px;
            width: 100%;
            padding: 40px 50px;
            box-shadow:
                0 0 15px var(--gold),
                0 0 30px var(--gold-dark);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* Logo */
        .logo {
            max-width: 120px;
            margin: 0 auto 30px;
            filter: drop-shadow(0 0 5px var(--gold));
            transition: transform 0.3s ease;
            cursor: pointer;
        }
        .logo:hover,
        .logo:focus {
            transform: scale(1.1) rotate(5deg);
            outline: none;
        }

        h1 {
            font-weight: 700;
            font-size: 3rem;
            margin-bottom: 20px;
            text-shadow:
                0 0 5px var(--gold),
                0 0 10px var(--gold-dark);
        }

        p {
            font-weight: 500;
            font-size: 1.25rem;
            margin-bottom: 40px;
            color: #d4af5533; /* emas transparan */
            text-shadow: 0 0 3px var(--gold-dark);
            transition: color 0.3s ease;
        }
        p:hover,
        p:focus {
            color: var(--gold);
            cursor: default;
            outline: none;
        }

        a.button-link {
            display: inline-block;
            background: linear-gradient(45deg, var(--gold), var(--gold-dark));
            color: var(--black);
            font-weight: 700;
            font-size: 1.3rem;
            padding: 18px 50px;
            border-radius: 50px;
            text-decoration: none;
            box-shadow:
                0 5px 15px var(--gold-dark),
                0 0 10px var(--gold);
            transition: background 0.4s ease, box-shadow 0.4s ease, transform 0.2s ease;
            letter-spacing: 1.2px;
            user-select: none;
        }
        a.button-link:hover,
        a.button-link:focus {
            background: linear-gradient(45deg, var(--gold-dark), var(--gold));
            box-shadow:
                0 8px 25px var(--gold),
                0 0 20px var(--gold-dark);
            outline: 3px solid var(--gold);
            outline-offset: 4px;
            transform: scale(1.05);
        }

        /* Subtle animated gold particles background */
        .container::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background:
                radial-gradient(circle at 20% 30%, var(--gold) 2px, transparent 3px),
                radial-gradient(circle at 80% 70%, var(--gold-dark) 3px, transparent 4px),
                radial-gradient(circle at 50% 50%, var(--gold) 1.5px, transparent 2px);
            background-repeat: repeat;
            background-size: 100px 100px;
            animation: moveParticles 30s linear infinite;
            opacity: 0.15;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes moveParticles {
            0% {
                background-position: 0 0, 0 0, 0 0;
            }
            100% {
                background-position: 100px 100px, 100px 100px, 100px 100px;
            }
        }

        /* Ensure content is above particles */
        .container > * {
            position: relative;
            z-index: 1;
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 25px;
            }
            h1 {
                font-size: 2.2rem;
            }
            p {
                font-size: 1rem;
            }
            a.button-link {
                font-size: 1.1rem;
                padding: 15px 35px;
            }
            .logo {
                max-width: 90px;
                margin-bottom: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container" role="main" aria-label="Halaman pembayaran KJS-STORE">
        <img src="https://files.catbox.moe/c0l73v.jpg" alt="Logo KJS-STORE" class="logo" tabindex="0" />
        <h1>Selamat datang di KJS-STORE</h1>
        <p>Klik tombol di bawah untuk melanjutkan transaksi dengan aman dan cepat.</p>
        <a class="button-link" href="https://www.blackbox.ai/share/bfcdad56-505e-4e05-8916-1e8271613963?fullScreen=true" target="_blank" rel="noopener noreferrer" role="button" aria-label="Buka untuk melanjutkan transaksi">
            Buka Untuk Melanjutkan Transaksi
        </a>
    </div>
</body>
</html>
